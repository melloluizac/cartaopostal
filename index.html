<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ede6d6" />

    <!-- Favicon: SVG primeiro (nítido em qualquer tamanho, navegadores modernos
         de desktop), com fallback em .ico/.png pra quem não suporta SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Ícone da Tela de Início no iOS. O Safari do iPhone EXIGE um PNG aqui —
         SVG é ignorado nesse link específico e cai pra um print da tela. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest: transforma o "atalho salvo" num app instalável de
         verdade, categoria que o iOS trata com mais respeito de
         armazenamento persistente do que um simples atalho de página. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Deixa a barra de status mais integrada quando o app é aberto a partir
         do ícone salvo na Tela de Início (modo standalone). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cartão Postal" />

    <title>Cartão Postal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
